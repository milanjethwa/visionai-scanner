name: 🚀 Deploy to Vercel

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: 🔍 Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install Vercel CLI
        run: npm install -g vercel

      - name: 📦 Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "## 🔍 Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Live at: $URL" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Vercel Preview Deployed!\n\n🔗 **Preview URL:** ${{ steps.deploy.outputs.preview_url }}\n\n> Auto-deployed by GitHub Actions`
            })

  deploy-production:
    name: 🌐 Deploy Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install Vercel CLI
        run: npm install -g vercel

      - name: 📦 Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production_url=$URL" >> $GITHUB_OUTPUT
          echo "## 🌐 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Live at: $URL" >> $GITHUB_STEP_SUMMARY

      - name: ✅ Deployment Summary
        run: |
          echo "🎉 Deployed to production!"
          echo "URL: ${{ steps.deploy.outputs.production_url }}"
