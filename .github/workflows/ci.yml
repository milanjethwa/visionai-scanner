name: ✅ CI — Validate & Lint

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  validate:
    name: HTML Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install html-validate
        run: npm install -g html-validate

      - name: 🔍 Validate HTML
        run: html-validate index.html

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📏 Check file sizes
        run: |
          echo "## 📦 File Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in *.html *.css *.js; do
            [ -f "$f" ] && echo "| $f | $(du -sh $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done
          SIZE=$(du -sb index.html | cut -f1)
          echo ""
          echo "Total index.html size: $(du -sh index.html | cut -f1)"
          if [ "$SIZE" -gt 524288 ]; then
            echo "❌ index.html exceeds 512 KB limit!"
            exit 1
          else
            echo "✅ Size check passed."
          fi

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install serve & Lighthouse CI
        run: npm install -g @lhci/cli serve

      - name: 🌐 Start local server
        run: serve . -p 3000 &

      - name: ⏳ Wait for server
        run: sleep 3

      - name: 🔦 Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url=http://localhost:3000 \
            --collect.numberOfRuns=1 \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance=off \
            --assert.assertions.categories:seo=warn \
            --assert.assertions.categories:accessibility=warn \
            --assert.assertions.categories:best-practices=warn \
            --upload.target=temporary-public-storage || true
