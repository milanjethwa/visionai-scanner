name: ✅ CI — Validate & Lint

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install html-validate
        run: npm install -g html-validate

      - name: 📝 Create html-validate config
        run: |
          cat > .htmlvalidate.json << 'EOF'
          {
            "extends": ["html-validate:recommended"],
            "rules": {
              "no-inline-style": "off",
              "long-title": "off",
              "no-trailing-whitespace": "off",
              "prefer-native-element": "off",
              "wcag/h30": "off",
              "wcag/h32": "off",
              "wcag/h36": "off",
              "wcag/h37": "off",
              "wcag/h67": "off"
            }
          }
          EOF

      - name: 🔍 Validate HTML
        run: html-validate index.html

  size-check:
    name: 📏 Size Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Check file size
        run: |
          SIZE=$(wc -c < index.html)
          SIZE_KB=$(echo "scale=1; $SIZE/1024" | bc)
          echo "## 📦 File Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| index.html | ${SIZE_KB} KB |" >> $GITHUB_STEP_SUMMARY
          if [ "$SIZE" -gt 524288 ]; then
            echo "❌ index.html exceeds 512 KB!"
            exit 1
          fi
          echo "✅ Size check passed — ${SIZE_KB} KB"
